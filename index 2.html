<script>

function scoresFor(g){let h=[...g.id].reduce((n,c)=>(n*23+c.charCodeAt(0))%99991,71);let lost=h%3;let seq=lost===0?[1,1,1]:lost===1?[1,0,1,1]:[0,1,0,1,1];return seq.map((winnerTakes,i)=>{let lo=5+(h+i*2)%5;let winA=g.winner===g.a;let aWins=winA===Boolean(winnerTakes);return aWins?[11,lo]:[lo,11];});}

function renderProfile(){let p=state.player,another=state.other,all=playerMatches(p),direct=another?duels(p,another):[];let showH2h=state.origin==='match'&&!!another;let list=state.tab==='h2h'&&showH2h?direct:all,shown=state.tab==='h2h'?state.visibleH2h:state.visibleAll;
let title=state.tab==='h2h'?'Testa a testa':'Partite precedenti';
let streak=showH2h?`<div class="caption">Ultimi cinque scontri diretti, dal più recente. Tocca V o S per aprire il risultato.</div><div class="streak">${direct.slice(0,5).map(g=>`<button type="button" data-match="${g.id}" class="${outcome(g,p)==='V'?'win':'loss'}">${outcome(g,p)}</button>`).join('')}</div>`:'';
return `${back('Profilo giocatore')}<div class="profile"><span class="avatar">${initials(p)}</span><div><b>${esc(p)}</b><small>${showH2h?'Dalla partita contro '+esc(another):'Aperto dalla classifica'}</small></div></div>${showH2h?`<div class="tabs" role="tablist" aria-label="Tipo di storico"><button type="button" role="tab" data-tab="all" aria-selected="${state.tab==='all'}">Partite precedenti</button><button type="button" role="tab" data-tab="h2h" aria-selected="${state.tab==='h2h'}">Testa a testa</button></div>`:''}<div class="statline"><b>${esc(title)}</b><small>${list.length} incontri</small></div>${state.tab==='h2h'&&showH2h?`<p class="mini">${esc(p)} contro ${esc(another)}. Risultati dal punto di vista di ${esc(first(p))}.</p>${streak}`:'<p class="mini">Tutti i risultati del giocatore contro qualsiasi avversario, dal più recente al più vecchio.</p>'}<div class="card" id="records">${list.slice(0,shown).map(g=>resrow(g,p)).join('')||'<div class="empty">Nessuna partita disponibile nella simulazione.</div>'}${shown<list.length?`<div style="padding:0 12px 12px"><button type="button" class="action" data-more="${state.tab}">Carica altri ${Math.min(5,list.length-shown)} incontri ↓</button></div>`:''}<div class="count">Visualizzati ${Math.min(shown,list.length)} di ${list.length}</div></div>${foot()}`;}
function render(){const target=$('#app-main');target.innerHTML=state.page==='partite'?renderPartite():state.page==='classifica'?renderRanking():state.page==='match'?renderMatch():renderProfile();document.querySelectorAll('[data-main]').forEach(b=>b.setAttribute('aria-current',state.page===b.dataset.main?'page':'false'));}
document.addEventListener('click',ev=>{let b=ev.target.closest('button');if(!b)return;
if(b.hasAttribute('data-main'))return switchRoot(b.dataset.main);
if(b.hasAttribute('data-back'))return previous();
if(b.hasAttribute('data-ranking'))return next({page:'profile',player:b.dataset.ranking,other:null,origin:'ranking',tab:'all',visibleAll:5,visibleH2h:5});
if(b.hasAttribute('data-from-match')){let g=matches.find(x=>x.id===state.matchId),p=b.dataset.fromMatch;return next({page:'profile',player:p,other:enemy(g,p),origin:'match',tab:'all',visibleAll:5,visibleH2h:5})}
if(b.hasAttribute('data-match'))return next({page:'match',matchId:b.dataset.match});
if(b.hasAttribute('data-tab')){state.tab=b.dataset.tab;render();$('#records').scrollIntoView({block:'nearest',behavior:'instant'});return;}
if(b.hasAttribute('data-more')){let prop=b.dataset.more==='h2h'?'visibleH2h':'visibleAll',y=window.scrollY;state[prop]+=5;render();requestAnimationFrame(()=>window.scrollTo(0,y));}
});
render();
})();
</script>
</body></html>
